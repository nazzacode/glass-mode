# Site request → pull request. A maintainer labels a "site request" issue `add-site`; CI runs the same one command a
# contributor would (`./glasslab add --agent`) on the PUBLIC pages in headless Firefox, then opens a PR with the style
# and the test report. Least privilege: the agent job can only read the repo (no push token: persist-credentials false);
# the agent itself works in a sandbox copy and its CSS is linted (pipeline.py). A separate job opens the PR from the
# job's artifact. Needs repo secret ANTHROPIC_API_KEY (or GLASSLAB_AGENT for another CLI agent). Logged-in apps: locally.
name: Add site

on:
  issues:
    types: [labeled]

jobs:
  add-site:
    if: github.event.label.name == 'add-site'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      site: ${{ steps.req.outputs.site }}
      outcome: ${{ steps.add.outcome }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Read the request
        id: req
        env:
          BODY: ${{ github.event.issue.body }}   # untrusted: only via env, validated below
        run: |
          python - <<'PY'
          import os, re
          body = os.environ["BODY"]
          field = lambda name: (re.search(rf"### {name}\s+(.+?)\s*(?:\n###|\Z)", body, re.S) or [None, ""])[1].strip()
          site, url = field("Site"), field("Start URL")
          assert re.fullmatch(r"[a-z0-9.-]+\.[a-z]{2,}", site), f"bad site {site!r}"
          assert re.fullmatch(r"https://[a-z0-9.-]+(/[\w./?=&%#-]*)?", url), f"bad url {url!r}"
          name = site.removeprefix("www.").split(".")[0].capitalize()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"site={site}\nurl={url}\nname={name}\n")
          PY

      - name: Install
        run: |
          npm ci
          pip install websockets pillow numpy pytest
          npm install -g @anthropic-ai/claude-code@2.1.283

      - name: glasslab add
        id: add
        continue-on-error: true
        env:
          GLASSLAB_BROWSER: firefox
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAME: ${{ steps.req.outputs.name }}
          URL: ${{ steps.req.outputs.url }}
        run: python -m tools.glasslab add "$NAME" "$URL" --agent --rounds 4

      - name: Collect
        env:
          NAME: ${{ steps.req.outputs.name }}
        run: |
          slug=$(echo "$NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9\n' '-')
          mkdir -p out/styles/websites out/data out/tools/glasslab
          cp ~/.cache/glasslab/add/$slug/report-public.md out/report.md || echo "no report" > out/report.md
          git status --porcelain -- styles/websites | awk '{print $2}' | xargs -r -I{} cp {} out/styles/websites/
          cp data/ContentScripts.json out/data/ && cp tools/glasslab/screens.json out/tools/glasslab/

      - uses: actions/upload-artifact@v4
        with: { name: site, path: out }

  pull-request:
    needs: add-site
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: Apply (CSS must pass the lint again; only these paths)
        run: |
          python - <<'PY'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from tools.glasslab.pipeline import lint_css
          for css in Path("out/styles/websites").glob("*.css"):
              assert not lint_css(css.read_text()), css
              shutil.copy(css, Path("styles/websites") / css.name)
          shutil.copy("out/data/ContentScripts.json", "data/ContentScripts.json")
          shutil.copy("out/tools/glasslab/screens.json", "tools/glasslab/screens.json")
          PY
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: add-site/${{ needs.add-site.outputs.site }}
          title: "Add ${{ needs.add-site.outputs.site }} (glasslab add)"
          commit-message: "Add ${{ needs.add-site.outputs.site }} via glasslab add"
          add-paths: |
            styles/websites/*.css
            data/ContentScripts.json
            tools/glasslab/screens.json
          body-path: out/report.md
          labels: site request
          draft: ${{ needs.add-site.outputs.outcome != 'success' }}   # not green yet → draft for a human pass
      - name: Tell the issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.add-site.outputs.outcome }}
        run: gh issue comment ${{ github.event.issue.number }} --body "glasslab add finished ($OUTCOME). Pull request: see linked PRs; report attached there."
